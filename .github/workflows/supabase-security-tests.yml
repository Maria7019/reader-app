name: Supabase database security tests

on:
  push:
    branches:
      - feature/account-sync
  pull_request:
    branches:
      - security/audit-baseline
      - main

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services
        run: supabase start -x studio,edge-runtime,logflare,vector

      - name: Apply migrations and run pgTAP tests
        run: supabase test db

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
