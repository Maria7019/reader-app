<script>

var state;try{state=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){state=initial}state=state&&typeof state==='object'?state:initial;state.books=Array.isArray(state.books)?state.books:initial.books.slice();state.disciplines=Array.isArray(state.disciplines)?state.disciplines:initial.disciplines.slice();state.subdisciplines=state.subdisciplines&&typeof state.subdisciplines==='object'?state.subdisciplines:{};state.disciplineIcons=state.disciplineIcons&&typeof state.disciplineIcons==='object'?state.disciplineIcons:{};state.subdisciplineIcons=state.subdisciplineIcons&&typeof state.subdisciplineIcons==='object'?state.subdisciplineIcons:{};var libraryIconSet=['♙','⚙','♣','✧','◇','☼','♧','✦','⌘','❋','◈','✺'];state.disciplines.forEach(function(d){if(!state.disciplineIcons[d])state.disciplineIcons[d]=libraryIconSet[Math.floor(Math.random()*libraryIconSet.length)]});state.profile=state.profile&&typeof state.profile==='object'?state.profile:initial.profile;state.books=state.books.map(function(b){b=b&&typeof b==='object'?b:{};b.notes=Array.isArray(b.notes)?b.notes:[];b.quotes=Array.isArray(b.quotes)?b.quotes:[];b.characters=Array.isArray(b.characters)?b.characters:[];return b});var tab='home',detailTab='about',notePage=0,searchText='',librarySearch='',libraryPath={discipline:null,subdiscipline:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.error('Inkly storage error:',e);showFatal('Не удалось сохранить данные в памяти браузера: '+(e&&e.message||e));return false}}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){var e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(function(){e.remove()},2000)}
function go(t){tab=t;state.activeBook=null;if(t==='library'){libraryPath={discipline:null,subdiscipline:null};librarySearch=''}render()}function bookCover(b,extra){var st=b.cover?'background-image:linear-gradient(#0002,#0003),url('+JSON.stringify(b.cover)+')':'background:'+esc(b.color||'#727b59');return '<div class="cover '+(extra||'')+'" style="'+st+'"><span>'+esc(b.title)+'</span></div>'}
function bookCard(b){return '<article class="book" onclick="openBook(\''+b.id+'\')">'+bookCover(b)+'<div class="book-title">'+esc(b.title)+'</div><div class="book-author">'+esc(b.author)+'</div></article>'}

var continuePage=0, dailyLoading=false;
function initials(s){return String(s||'?').split(/\\s+/).slice(0,2).map(function(x){return x[0]||''}).join('').toUpperCase()}
function homePage(v){
 var noted=state.books.filter(function(b){return (b.notes||[]).some(function(n){return String(n||'').trim()})}).slice(0,5);
 var topAuthors={};state.books.forEach(function(b){var count=(b.notes||[]).filter(function(n){return String(n||'').trim()}).length;if(count&&b.author){topAuthors[b.author]=(topAuthors[b.author]||0)+count}});
 var authors=Object.keys(topAuthors).sort(function(a,b){return topAuthors[b]-topAuthors[a]}).slice(0,5);
 var sections=state.disciplines||[];
 v.innerHTML='<div class="home-search"><span style="color:#8b8e80">⌕</span><input id="home-search" placeholder="Найти книгу, автора или тему..." onkeydown="if(event.key===\'Enter\'){searchText=this.value;go(\'library\')}"><button onclick="searchText=document.getElementById(\'home-search\').value;go(\'library\')">Найти</button></div>'+
 '<section class="daily-card" id="daily-content"><div class="daily-cover"><span>Книга<br>дня</span></div><div class="daily-info"><h2>Подбираем книгу дня…</h2><p>Ищем книгу по твоим интересам и любимым разделам.</p></div></section>'+
 '<section class="home-section"><div class="section-head"><h2>Продолжить записи</h2><button class="btn ghost small" onclick="go(\'notes\')">Все записи</button></div><div class="continue-wrap"><div class="continue-list" id="continue-list"></div><div class="continue-controls"><button onclick="shiftContinue(-1)" aria-label="Предыдущие книги">‹</button><button onclick="shiftContinue(1)" aria-label="Следующие книги">›</button></div></div></section>'+
 '<section class="home-section"><div class="section-head"><h2>Мои авторы</h2></div><div class="author-strip">'+(authors.length?authors.map(function(a){return '<div class="author-item"><div class="author-avatar">'+initials(a)+'</div><strong>'+esc(a)+'</strong></div>'}).join(''):['Austin Kleon','James Clear','Rick Rubin','Ursula Le Guin','Virginia Woolf'].map(function(a){return '<div class="author-item"><div class="author-avatar">'+initials(a)+'</div><strong>'+esc(a)+'</strong></div>'}).join(''))+'</div></section>'+
 '<section class="home-section"><div class="section-head"><h2>Мои разделы</h2></div><div class="section-chips">'+sections.map(function(d){return '<span class="chip">'+esc(d)+'</span>'}).join('')+'</div></section>';
 renderContinue();
 loadBookOfDay();
}
function renderContinue(){
 var el=document.getElementById('continue-list');if(!el)return;
 var noted=state.books.filter(function(b){return (b.notes||[]).some(function(n){return String(n||'').trim()})}).slice(0,5);
 var items=noted.length?noted:state.books.slice(0,5);
 var demo=[{id:'demo-atomic',title:'Atomic Habits',author:'James Clear',color:'#a08d6d',demo:true,progress:48},{id:'demo-creative',title:'The Creative Act',author:'Rick Rubin',color:'#68747d',demo:true,progress:28},{id:'demo-woolf',title:'A Room of One Own',author:'Virginia Woolf',color:'#7c8064',demo:true,progress:65}];
 while(items.length<2&&demo.length)items.push(demo.shift());
 if(!items.length){el.innerHTML='<div class="empty">Здесь появятся книги, в которых ты ведёшь записи.</div>';return}
 continuePage=Math.min(continuePage,Math.max(0,Math.ceil(items.length/2)-1));
 var visible=items.slice(continuePage*2,continuePage*2+2);
 el.innerHTML=visible.map(function(b){var done=(b.notes||[]).filter(function(n){return String(n||'').trim()}).length;var progress=b.demo?b.progress:Math.min(100,done*25);var cover=b.cover?'background-image:linear-gradient(#0002,#0003),url('+JSON.stringify(b.cover)+')':'background:'+esc(b.color||'#9b896d');return '<article class="continue-card" '+(b.demo?'':'onclick="openBook(&quot;'+b.id+'&quot;);detailTab=&quot;notes&quot;;render()"')+'><div class="continue-cover" style="'+cover+'">'+(b.cover?'':esc(b.title))+'</div><div class="continue-meta"><strong>'+esc(b.title)+'</strong><div class="muted">'+esc(b.author)+'</div><div class="progress"><span style="width:'+progress+'%"></span></div><div class="muted" style="font-size:11px">'+(b.demo?'Пример оформления':'Есть записи · продолжить')+'</div></div></article>'}).join('');
 var controls=document.querySelector('.continue-controls');if(controls)controls.style.display=items.length>2?'flex':'none';
 el.ontouchstart=function(e){this.dataset.touchX=e.changedTouches[0].screenX};
 el.ontouchend=function(e){var dx=e.changedTouches[0].screenX-Number(this.dataset.touchX||0);if(Math.abs(dx)>45)shiftContinue(dx<0?1:-1)};
}
function shiftContinue(d){var items=state.books.filter(function(b){return (b.notes||[]).some(function(n){return String(n||'').trim()})}).slice(0,5);if(!items.length)items=state.books.slice(0,5);var demos=[{id:'demo-atomic'},{id:'demo-creative'}];while(items.length<2&&demos.length)items.push(demos.shift());var pages=Math.ceil(items.length/2);if(pages<2)return;continuePage=(continuePage+d+pages)%pages;renderContinue()}
function loadBookOfDay(){
 var box=document.getElementById('daily-content');if(!box)return;
 var today=new Date().toISOString().slice(0,10);
 if(state.dailyBook&&state.dailyBook.date===today){showDailyBook(state.dailyBook);return}
 if(dailyLoading)return;dailyLoading=true;
 var topics=(state.disciplines||[]);var topic=topics.length?topics[(new Date().getDate()+new Date().getMonth())%topics.length]:'literature';
 var query=encodeURIComponent('subject:'+topic);
 fetch('https://www.googleapis.com/books/v1/volumes?q='+query+'&maxResults=20&printType=books&langRestrict=ru')
 .then(function(r){if(!r.ok)throw Error('API');return r.json()})
 .then(function(data){var list=(data.items||[]).filter(function(x){return x.volumeInfo&&x.volumeInfo.title});if(!list.length)throw Error('No books');var idx=(new Date().getDate()*7+new Date().getMonth()*13)%list.length;var info=list[idx].volumeInfo;var image=info.imageLinks&&(info.imageLinks.thumbnail||info.imageLinks.smallThumbnail)||'';image=image.replace(/^http:/,'https:');state.dailyBook={date:today,title:info.title,author:(info.authors||[]).join(', '),description:(info.description||'Аннотация пока не предоставлена издателем.').replace(/<[^>]*>/g,' ').slice(0,650),cover:image,discipline:topic,year:info.publishedDate||''};save();showDailyBook(state.dailyBook)})
 .catch(function(){box.innerHTML='<div class="daily-cover"><span>Inkly<br>рекомендует</span></div><div class="daily-info"><h2>Книга дня</h2><p>Не удалось получить подборку из каталога книг. Проверь подключение к интернету и попробуй обновить страницу.</p><button class="daily-add" onclick="loadBookOfDay(true)">Повторить</button></div>'})
 .finally(function(){dailyLoading=false});
}
function showDailyBook(b){var box=document.getElementById('daily-content');if(!box)return;var cover=b.cover?'<div class="daily-cover" style="background-image:url('+JSON.stringify(b.cover)+')"></div>':'<div class="daily-cover"><span>'+esc(b.title)+'</span></div>';box.innerHTML=cover+'<div class="daily-info"><div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.8;margin-bottom:4px">Книга дня · '+esc(b.discipline||'')+'</div><h2>'+esc(b.title)+'</h2><div style="font-size:13px;opacity:.9;margin:-3px 0 7px">'+esc(b.author||'')+'</div><p>'+esc(b.description||'Аннотация не найдена.')+'</p><button class="daily-add" onclick="addDailyBook()">Добавить в раздел +</button></div>'}
function addDailyBook(){var b=state.dailyBook;if(!b)return;modal('<div class="dialog-head"><h2>Добавить книгу в раздел</h2><button class="close" onclick="closeModal()">×</button></div><p><strong>'+esc(b.title)+'</strong></p><div class="field"><label>Выбери раздел</label><select id="daily-section">'+(state.disciplines||[]).map(function(d){return '<option>'+esc(d)+'</option>'}).join('')+'</select></div><button class="btn" onclick="confirmDailyBook()">Добавить в библиотеку</button>')}
function confirmDailyBook(){var b=state.dailyBook;if(!b)return;var d=document.getElementById('daily-section').value;if(state.books.some(function(x){return x.title===b.title&&x.author===b.author})){closeModal();toast('Эта книга уже есть в библиотеке');return}state.books.push({id:'b'+Date.now(),title:b.title,author:b.author,year:b.year,discipline:d,description:b.description,cover:b.cover,color:'#727b59',status:'В планах',rating:0,notes:[],quotes:[],characters:[]});save();closeModal();toast('Книга добавлена в библиотеку')}

function openDiscipline(name){libraryPath={discipline:name,subdiscipline:null};librarySearch='';render()}
function openSubdiscipline(name){libraryPath.subdiscipline=name;librarySearch='';render()}
function libraryBack(){if(libraryPath.subdiscipline){libraryPath.subdiscipline=null}else if(libraryPath.discipline){libraryPath.discipline=null}librarySearch='';render()}
function randomLibraryIcon(){var icons=['♙','⚙','♣','✧','◇','☼','♧','✦','⌘','❋','◈','✺'];return icons[Math.floor(Math.random()*icons.length)]}
function libraryCard(name,icon,count,kind){var fn=kind==='discipline'?'openDiscipline':'openSubdiscipline';return '<button type="button" class="discipline-card" data-name="'+esc(name)+'" onclick="'+fn+'(this.getAttribute(\'data-name\'))"><span class="discipline-icon">'+esc(icon||'✧')+'</span><strong>'+esc(name)+'</strong><small>'+esc(count)+'</small></button>'}
function libraryCardsHtml(){
 var q=librarySearch.trim().toLowerCase(),html='';
 if(!libraryPath.discipline){
  var names=state.disciplines.filter(function(d){return !q||d.toLowerCase().includes(q)||(state.subdisciplines[d]||[]).some(function(s){return s.toLowerCase().includes(q)})});
  html='<div class="discipline-grid">'+(names.length?names.map(function(d){var count=(state.subdisciplines[d]||[]).length;return libraryCard(d,state.disciplineIcons[d],count?count+' подраздела':state.books.filter(function(b){return b.discipline===d}).length+' книг','discipline')}).join(''):'<div class="empty library-empty">Дисциплины не найдены.</div>')+'</div>';
  if(q){var found=state.books.filter(function(b){return (b.title+' '+b.author+' '+(b.discipline||'')+' '+(b.subdiscipline||'')).toLowerCase().includes(q)});if(found.length)html+='<div class="library-subtitle">Найденные книги</div><div class="library-books">'+found.map(bookCard).join('')+'</div>'}
  return html;
 }
 var d=libraryPath.discipline,subs=state.subdisciplines[d]||[];
 if(!libraryPath.subdiscipline){
  var matching=subs.filter(function(s){return !q||s.toLowerCase().includes(q)});
  html='<div class="discipline-grid">'+(matching.length?matching.map(function(s){var n=state.books.filter(function(b){return b.discipline===d&&b.subdiscipline===s}).length;var icons=state.subdisciplineIcons[d]||{};return libraryCard(s,icons[s],n+' книг','subdiscipline')}).join(''):'<div class="empty library-empty">'+(q?'Подразделы не найдены.':'Пока нет подразделов. Добавьте первый раздел.')+'</div>')+'</div>';
  var unassigned=state.books.filter(function(b){return b.discipline===d&&!b.subdiscipline&&(!q||(b.title+' '+b.author).toLowerCase().includes(q))});
  if(unassigned.length)html+='<div class="library-subtitle">Книги без подраздела</div><div class="library-books">'+unassigned.map(bookCard).join('')+'</div>';
  return html;
 }
 var sub=libraryPath.subdiscipline,books=state.books.filter(function(b){return b.discipline===d&&b.subdiscipline===sub&&(!q||(b.title+' '+b.author).toLowerCase().includes(q))});
 return books.length?'<div class="library-books">'+books.map(bookCard).join('')+'</div>':'<div class="empty">Здесь пока нет книг. Добавьте первую.</div>';
}
function updateLibraryResults(){var box=document.getElementById('library-results');if(box)box.innerHTML=libraryCardsHtml()}
function renderLibrary(v){
 var d=libraryPath.discipline,sub=libraryPath.subdiscipline,title=sub||d||'Моя библиотека';
 var subtitle=sub?'Книги и заметки в выбранном подразделе.':d?'Выберите подраздел или создайте собственную структуру.':'Собрание книг, идей и дисциплин, которые вы изучаете.';
 var addLabel=sub?'＋ Добавить книгу':d?'＋ Добавить подраздел':'＋ Добавить';
 var back=d?'<button class="library-back" onclick="libraryBack()">← '+(sub?esc(d):'Все дисциплины')+'</button>':'';
 var heading=(d||sub)?'<div class="library-toolbar"><h2>'+esc(title)+'</h2><button class="btn small" onclick="'+(sub?'bookForm()':'addSubdisciplineForm()')+'">'+addLabel+'</button></div>':'<div class="library-toolbar"><h2>Дисциплины</h2><button class="btn small" onclick="addDisciplineForm()">'+addLabel+'</button></div>';
 v.innerHTML=back+'<div class="library-title"><h1>'+esc(title)+'</h1><p>'+subtitle+'</p></div><input class="library-search" placeholder="Поиск по названию, автору или теме…" value="'+esc(librarySearch)+'" oninput="librarySearch=this.value;updateLibraryResults()">'+heading+'<div id="library-results">'+libraryCardsHtml()+'</div>';
}
function addDisciplineForm(){modal('<div class="dialog-head"><h2>Новая дисциплина</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Название дисциплины</label><input id="new-discipline-name" placeholder="Например, экономика" maxlength="48"></div><button class="btn" onclick="createDiscipline()">Добавить дисциплину</button>')}
function createDiscipline(){var x=document.getElementById('new-discipline-name').value.trim();if(!x){toast('Введите название дисциплины');return}if(state.disciplines.some(function(d){return d.toLowerCase()===x.toLowerCase()})){toast('Такая дисциплина уже есть');return}state.disciplines.push(x);state.disciplineIcons[x]=randomLibraryIcon();state.subdisciplines[x]=[];save();closeModal();render();toast('Дисциплина добавлена')}
function addSubdisciplineForm(){if(!libraryPath.discipline)return;modal('<div class="dialog-head"><h2>Новый подраздел</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted" style="font-size:13px">'+esc(libraryPath.discipline)+'</p><div class="field"><label>Название подраздела</label><input id="new-subdiscipline-name" placeholder="Например, нейропсихология" maxlength="48"></div><button class="btn" onclick="createSubdiscipline()">Добавить подраздел</button>')}
function createSubdiscipline(){var x=document.getElementById('new-subdiscipline-name').value.trim(),d=libraryPath.discipline;if(!x||!d)return;if(!state.subdisciplines[d])state.subdisciplines[d]=[];if(state.subdisciplines[d].some(function(s){return s.toLowerCase()===x.toLowerCase()})){toast('Такой подраздел уже есть');return}state.subdisciplines[d].push(x);if(!state.subdisciplineIcons[d])state.subdisciplineIcons[d]={};state.subdisciplineIcons[d][x]=randomLibraryIcon();save();closeModal();render();toast('Подраздел добавлен')}

function render(){document.body.classList.toggle('library-open',tab==='library'&&!state.activeBook);document.body.classList.toggle('profile-open',tab==='profile'&&!state.activeBook);document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});var v=document.getElementById('view');if(state.activeBook){detail(v);return}
if(tab==='home'){homePage(v)}
if(tab==='library'){renderLibrary(v)}
if(tab==='notes'){var all=state.books.filter(function(b){return (b.notes||[]).length});v.innerHTML='<div class="greeting"><div class="tag">Записная книжка</div><h1>Мои заметки</h1><div class="muted">Мысли, наблюдения и цитаты, связанные с книгами.</div></div>'+(all.length?all.map(function(b){return '<div class="panel rowitem"><strong>'+esc(b.title)+'</strong><small>'+b.notes.length+' страниц заметок</small><div class="actions"><button class="btn light small" onclick="openBook(\''+b.id+'\');detailTab=\'notes\';render()">Открыть заметки</button></div></div>'}).join(''):'<div class="empty">Заметки появятся здесь после добавления на страницы книг.</div>')}
if(tab==='profile'){
v.innerHTML=`
<div class="profile-head"><span class="profile-back">← Назад</span><span class="profile-edit">Изменить</span></div>
<div class="profile-identity">
  <div class="profile-avatar-wrap"><span class="profile-pencil">✎</span><div class="profile-avatar">И</div></div>
  <div class="profile-nickname">Никнейм</div>
  <div class="profile-email">Электронная почта</div>
</div>
<div class="profile-settings">
  ${['Управление аккаунтом','Настройки профиля','Уведомления','Настройка рекомендаций','Конфиденциальность и данные','Безопасность','Добавить аккаунт','Связь с ChatGPT'].map(function(x,i){return '<div class="profile-setting"><span class="profile-setting-icon">'+['♙','⚙','♧','✧','◈','⌑','＋','✳'][i]+'</span><span>'+x+'</span><span class="profile-chevron">›</span></div>'}).join('')}
</div>
<div class="profile-section-title">Оформление</div>
<div class="profile-panel">
  <div class="profile-label">Цвет интерфейса</div>
  <div class="profile-colors">
    ${['#6d7954','#7b6658','#647b83','#89718b','#a47755','#cfb4c0','#71435c','#24243d','#8e3047'].map(function(c){return '<button type="button" class="profile-swatch'+(state.theme===c?' selected':'')+'" style="background:'+c+'" data-theme="'+c+'" aria-label="Выбрать цвет '+c+'" aria-pressed="'+(state.theme===c)+'" onclick="setTheme(\''+c+'\')"></button>'}).join('')}
  </div>
</div>
<div class="profile-section-title profile-data-title">Данные</div>
<div class="profile-panel profile-data">
  <p>Сохраните резервную копию библиотеки или восстановите её на другом устройстве.</p>
  <div class="profile-data-actions"><span>Экспорт данных</span><span>Импорт данных</span></div>
  <p class="profile-data-note">Данные пока хранятся в этом браузере. Синхронизация между устройствами и аккаунты требуют серверного подключения.</p>
</div>
<div class="profile-logout">Выйти из аккаунта</div>`;
}
}
function openBook(id){state.activeBook=id;detailTab='about';notePage=0;render()}function active(){return state.books.find(function(b){return b.id===state.activeBook})}
function detail(v){var b=active();if(!b){state.activeBook=null;render();return}v.innerHTML='<button class="back" onclick="state.activeBook=null;render()">← Назад</button><div class="detail-top">'+bookCover(b,'detail-cover')+'<div><h1>'+esc(b.title)+'</h1><div class="muted">'+esc(b.author)+'</div><div class="chips"><span class="chip">'+esc(b.status||'Прочитано')+'</span>'+(b.discipline?'<span class="chip">'+esc(b.discipline)+'</span>':'')+'</div><div class="muted" style="font-size:12px">'+(b.year?'Год: '+esc(b.year):'')+(b.rating?' · Оценка: '+'★'.repeat(b.rating):'')+'</div><div class="actions"><button class="btn light small" onclick="bookForm(\''+b.id+'\')">Изменить</button><button class="btn ghost small" onclick="deleteBook(\''+b.id+'\')">Удалить</button></div></div></div><div class="tabs">'+[['about','О книге'],['review','Моё мнение'],['notes','Заметки'],['extras','Цитаты и герои']].map(function(a){return '<button class="'+(detailTab===a[0]?'active':'')+'" onclick="detailTab=\''+a[0]+'\';render()">'+a[1]+'</button>'}).join('')+'</div><div id="detail-body"></div>';var body=document.getElementById('detail-body');if(detailTab==='about')body.innerHTML='<div class="panel"><div class="tag">Описание</div><p>'+esc(b.description||'Описание пока не добавлено.')+'</p></div>';if(detailTab==='review')body.innerHTML='<div class="field"><label>Личное мнение и рецензия</label><textarea id="review-text" placeholder="Что вы думаете об этой книге?">'+esc(b.opinion)+'</textarea></div><button class="btn" onclick="saveReview()">Сохранить мнение</button>';if(detailTab==='notes')body.innerHTML='<div class="page-controls"><button onclick="changePage(-1)">← Предыдущая</button><span class="muted">Страница '+(notePage+1)+' из '+Math.max(1,(b.notes||[]).length)+'</span><button onclick="changePage(1)">Следующая →</button></div><div class="note-page"><textarea id="note-text" placeholder="Запишите мысль, наблюдение или идею…">'+esc((b.notes||[])[notePage]||'')+'</textarea><span class="page-num">'+(notePage+1)+'</span></div><div class="actions"><button class="btn" onclick="saveNote()">Сохранить страницу</button><button class="btn light" onclick="addPage()">＋ Новая страница</button></div>';if(detailTab==='extras')body.innerHTML='<div class="field"><label>Цитаты — каждая с новой строки</label><textarea id="quotes-text">'+esc((b.quotes||[]).join('\n'))+'</textarea></div><div class="field"><label>Персонажи и темы</label><textarea id="characters-text">'+esc((b.characters||[]).join('\n'))+'</textarea></div><button class="btn" onclick="saveExtras()">Сохранить</button>'}
function modal(html){document.getElementById('modal-root').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()">'+html+'</div>'}function closeModal(){document.getElementById('modal-root').innerHTML=''}
function bookForm(id){var b=id?state.books.find(function(x){return x.id===id}):{};var chosenDiscipline=b.discipline||(libraryPath.discipline||'');var chosenSubdiscipline=b.subdiscipline||(libraryPath.subdiscipline||'');modal('<div class="dialog-head"><h2>'+(id?'Редактировать книгу':'Новая книга')+'</h2><button class="close" onclick="closeModal()">×</button></div><form id="book-form"><div class="field"><label>Название *</label><input name="title" required value="'+esc(b.title)+'"></div><div class="field"><label>Автор</label><input name="author" value="'+esc(b.author)+'"></div><div class="field"><label>Год издания</label><input name="year" inputmode="numeric" value="'+esc(b.year)+'"></div><div class="field"><label>Дисциплина</label><select name="discipline"><option value="">Без категории</option>'+state.disciplines.map(function(d){return '<option value="'+esc(d)+'" '+(chosenDiscipline===d?'selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select></div><div class="field"><label>Подраздел</label><input name="subdiscipline" value="'+esc(chosenSubdiscipline)+'" placeholder="Например, общая психология"></div><div class="field"><label>Статус</label><select name="status">'+['Прочитано','Читаю','В планах'].map(function(x){return '<option '+((b.status||'Прочитано')===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div class="field"><label>Описание</label><textarea name="description">'+esc(b.description)+'</textarea></div><div class="field"><label>Ссылка на обложку</label><input name="cover" type="url" value="'+esc(b.cover)+'" placeholder="https://…"></div><div class="field"><label>Цвет обложки</label><input name="color" type="color" value="'+(b.color||'#727b59')+'"></div><div class="field"><label>Оценка</label><select name="rating">'+[0,1,2,3,4,5].map(function(n){return '<option value="'+n+'" '+((b.rating||0)==n?'selected':'')+'>'+(n?n+'/5':'Не оценена')+'</option>'}).join('')+'</select></div><button class="btn" type="submit">Сохранить книгу</button></form>');document.getElementById('book-form').onsubmit=function(e){e.preventDefault();var data=Object.fromEntries(new FormData(e.target).entries());data.rating=Number(data.rating);if(id)Object.assign(b,data);else state.books.push(Object.assign(data,{id:'b'+Date.now(),notes:[],quotes:[],characters:[]}));save();closeModal();state.activeBook=id||null;render();toast('Книга сохранена')}}
function saveProfile(){state.profile.name=document.getElementById('pname').value;state.profile.about=document.getElementById('pabout').value;save();toast('Профиль сохранён')}function mixWithWhite(hex,amount){var h=String(hex).replace('#','');if(h.length!==6)return '#edf0e4';var n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;function m(v){return Math.round(v*amount+255*(1-amount))}return '#'+[m(r),m(g),m(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('')}function applyTheme(c){document.documentElement.style.setProperty('--olive',c);document.documentElement.style.setProperty('--soft',mixWithWhite(c,.12));document.documentElement.style.setProperty('--line',mixWithWhite(c,.22));document.documentElement.style.setProperty('--bg',mixWithWhite(c,.04));var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',mixWithWhite(c,.04))}function setTheme(c){applyTheme(c);state.theme=c;document.querySelectorAll('.profile-swatch').forEach(function(el){var selected=el.getAttribute('data-theme')===c;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected))});save()}function saveReview(){active().opinion=document.getElementById('review-text').value;save();toast('Мнение сохранено')}
function saveNote(){var b=active();b.notes=b.notes||[];b.notes[notePage]=document.getElementById('note-text').value;save();toast('Страница сохранена')}function changePage(n){var b=active();saveNote();notePage=Math.max(0,Math.min((b.notes||[]).length-1,notePage+n));render()}function addPage(){var b=active();saveNote();b.notes.push('');notePage=b.notes.length-1;save();render()}function saveExtras(){var b=active();b.quotes=document.getElementById('quotes-text').value.split('\n').filter(Boolean);b.characters=document.getElementById('characters-text').value.split('\n').filter(Boolean);save();toast('Сохранено')}
function deleteBook(id){if(!confirm('Удалить книгу и связанные заметки?'))return;state.books=state.books.filter(function(b){return b.id!==id});state.activeBook=null;save();render()}
function manageDisciplines(){modal('<div class="dialog-head"><h2>Мои категории</h2><button class="close" onclick="closeModal()">×</button></div><div>'+state.disciplines.map(function(d,i){return '<div class="rowitem">'+esc(d)+' <button class="btn ghost small" style="float:right" onclick="removeDiscipline('+i+')">Удалить</button></div>'}).join('')+'</div><div class="field"><label>Новая категория</label><input id="new-discipline" placeholder="Например, социология"></div><button class="btn" onclick="addDiscipline()">Добавить категорию</button>')}function addDiscipline(){var x=document.getElementById('new-discipline').value.trim();if(x&&!state.disciplines.includes(x)){state.disciplines.push(x);save();manageDisciplines()}}function removeDiscipline(i){state.disciplines.splice(i,1);save();manageDisciplines()}
function exportBackup(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inkly-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')}function importBackup(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.books)||!Array.isArray(d.disciplines))throw Error();state=d;save();render();toast('Данные восстановлены')}catch(x){alert('Не удалось прочитать резервную копию Inkly.')}};r.readAsText(f)}
function showFatal(message){var view=document.getElementById('view');if(view)view.innerHTML='<div class="panel" style="margin-top:24px"><h2 style="font:22px Georgia;margin-top:0">Inkly не удалось открыть</h2><p class="muted">'+esc(message)+'</p><p class="muted" style="font-size:12px">Ваши данные автоматически не удалялись. Сделайте скриншот этого сообщения.</p><button class="btn" onclick="location.reload()">Перезагрузить страницу</button></div>'}window.addEventListener('error',function(e){console.error('Inkly uncaught error:',e.error||e.message);showFatal((e.message||'Ошибка JavaScript')+(e.lineno?' · строка '+e.lineno:''))});window.addEventListener('unhandledrejection',function(e){console.error('Inkly rejected promise:',e.reason);showFatal('Ошибка загрузки: '+(e.reason&&e.reason.message||e.reason||'неизвестная ошибка'))});try{applyTheme(state.theme||'#6d7954');render()}catch(err){console.error('Inkly startup render error:',err);showFatal((err&&err.message||String(err))+(err&&err.stack?' · '+String(err.stack).split('\\n')[1] :''))}
</script></body></html>
