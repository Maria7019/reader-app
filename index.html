<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6ef"><title>Inkly</title>
<style>
:root{--bg:#f5f6ef;--paper:#fffefa;--ink:#292b25;--muted:#858879;--olive:#6d7954;--soft:#edf0e4;--line:#e5e7d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:85px}.top{padding:22px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font:600 28px Georgia;color:var(--olive)}.tag{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.content{padding:12px 18px 28px}.greeting{margin:8px 2px 22px}.greeting h1{font:500 29px/1.2 Georgia;margin:6px 0}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--olive);color:white;font-weight:600}.btn.light{background:var(--soft);color:var(--olive)}.btn.ghost{background:transparent;color:var(--olive);padding:7px}.btn.small{padding:8px 11px;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px}.section-head h2{font:500 21px Georgia;margin:0}.search{width:100%;border:1px solid var(--line);background:var(--paper);padding:13px;border-radius:14px}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.book{min-width:0;cursor:pointer}.cover{height:165px;border-radius:6px 12px 12px 6px;box-shadow:3px 5px 12px #2222;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:12px;position:relative;overflow:hidden;background-size:cover;background-position:center}.cover:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#ffffff45}.cover span{font:500 16px/1.25 Georgia;text-shadow:0 1px 4px #0008;z-index:1}.book-title{font-size:13px;font-weight:600;margin:8px 1px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-author{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px}.empty{text-align:center;color:var(--muted);border-style:dashed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);padding:14px;border-radius:14px}.stat strong{display:block;font:24px Georgia;color:var(--olive)}.stat span{font-size:11px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:10}.nav button{border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav b{font-size:21px;font-weight:400}.nav .active{color:var(--olive);font-weight:700}.back{border:0;background:none;color:var(--olive);padding:8px 0}.detail-top{display:flex;gap:17px;align-items:flex-start}.detail-top h1{font:500 25px/1.2 Georgia;margin:4px 0 6px}.detail-cover{width:116px;height:166px;flex:none}.chips,.actions,.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:var(--soft);color:var(--olive);border-radius:20px;padding:5px 10px;font-size:12px}.tabs{overflow:auto}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:8px 12px;background:transparent;color:var(--muted);font-size:13px}.tabs .active{background:var(--olive);color:white}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 12px;width:100%;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.modal{position:fixed;inset:0;background:#17190f80;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.dialog{width:min(100%,600px);max-height:90dvh;overflow:auto;background:var(--paper);border-radius:22px;padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{font:500 23px Georgia;margin:0}.close{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;color:var(--olive)}.note-page{background:#fffefa;border:1px solid #e9e4d5;box-shadow:0 7px 24px #24220c12;min-height:350px;padding:25px 23px 42px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#e9e8df 32px)}.note-page textarea{width:100%;min-height:260px;border:0;outline:0;resize:vertical;background:transparent;line-height:32px}.page-num{position:absolute;right:18px;bottom:12px;color:#999;font:12px Georgia}.page-controls{display:flex;justify-content:space-between;margin:12px 0}.page-controls button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;color:var(--olive)}.rowitem{padding:12px 0;border-bottom:1px solid var(--line)}.hide{display:none}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#30352a;color:white;padding:10px 16px;border-radius:22px;z-index:50;font-size:13px}@media(min-width:600px){.cover{height:205px}.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><div id="app"><header class="top"><div><div class="brand">Inkly.</div><div class="tag">your reading journal</div></div><button class="btn light small" onclick="bookForm()">＋ Книга</button></header><main class="content" id="view"></main><nav class="nav"><button data-tab="home" onclick="go('home')"><b>⌂</b>Главная</button><button data-tab="library" onclick="go('library')"><b>▤</b>Библиотека</button><button data-tab="notes" onclick="go('notes')"><b>▧</b>Заметки</button><button data-tab="profile" onclick="go('profile')"><b>◉</b>Профиль</button></nav></div><div id="modal-root"></div>
<script>
var KEY='inkly_v1',initial={books:[{id:'b1',title:'Steal Like an Artist',author:'Austin Kleon',year:'2012',discipline:'Творчество',description:'Книга о творчестве, влияниях и поиске собственного художественного языка.',opinion:'',cover:'',color:'#727b59',status:'Прочитано',rating:5,notes:[],characters:[],quotes:[]}],disciplines:['Творчество','Психология','История','Философия','Феминизм','Криминология','Экономика','Политика','Литература'],profile:{name:'Читатель',about:'Моя личная библиотека и пространство мыслей.'},theme:'#6d7954'};
var state;try{state=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){state=initial}var tab='home',detailTab='about',notePage=0,searchText='';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){var e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(function(){e.remove()},2000)}
function go(t){tab=t;state.activeBook=null;render()}function bookCover(b,extra){var st=b.cover?'background-image:linear-gradient(#0002,#0003),url('+JSON.stringify(b.cover)+')':'background:'+esc(b.color||'#727b59');return '<div class="cover '+(extra||'')+'" style="'+st+'"><span>'+esc(b.title)+'</span></div>'}
function bookCard(b){return '<article class="book" onclick="openBook(\''+b.id+'\')">'+bookCover(b)+'<div class="book-title">'+esc(b.title)+'</div><div class="book-author">'+esc(b.author)+'</div></article>'}
function render(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});var v=document.getElementById('view');if(state.activeBook){detail(v);return}
if(tab==='home'){v.innerHTML='<section class="greeting"><div class="tag">Личное пространство</div><h1>Добро пожаловать в Inkly</h1><div class="muted">Книги, мысли и заметки — в одном месте.</div></section><div class="stats"><div class="stat"><strong>'+state.books.length+'</strong><span>книг в библиотеке</span></div><div class="stat"><strong>'+state.books.filter(function(b){return b.status==='Прочитано'}).length+'</strong><span>прочитано</span></div><div class="stat"><strong>'+state.books.reduce(function(n,b){return n+(b.notes||[]).length},0)+'</strong><span>страниц заметок</span></div></div><div class="section-head"><h2>Недавно добавленные</h2><button class="btn ghost small" onclick="go(\'library\')">Все книги →</button></div>'+(state.books.length?'<div class="shelf">'+state.books.slice().reverse().slice(0,8).map(bookCard).join('')+'</div>':'<div class="empty">Библиотека пока пуста. Добавьте первую книгу.</div>')+'<div class="section-head"><h2>Мои разделы</h2><button class="btn ghost small" onclick="manageDisciplines()">Изменить</button></div><div class="chips">'+state.disciplines.map(function(d){return '<span class="chip">'+esc(d)+'</span>'}).join('')+'</div>'}
if(tab==='library'){var books=state.books.filter(function(b){return (b.title+' '+b.author+' '+b.discipline).toLowerCase().includes(searchText.toLowerCase())});v.innerHTML='<div class="greeting"><div class="tag">Коллекция</div><h1>Моя библиотека</h1><div class="muted">Собрание прочитанного и того, что ещё впереди.</div></div><input class="search" placeholder="Поиск по названию, автору или теме…" value="'+esc(searchText)+'" oninput="searchText=this.value;render()"><div class="section-head"><h2>'+books.length+' книг</h2><button class="btn small" onclick="bookForm()">＋ Добавить</button></div>'+(books.length?'<div class="shelf">'+books.map(bookCard).join('')+'</div>':'<div class="empty">Ничего не найдено.</div>')}
if(tab==='notes'){var all=state.books.filter(function(b){return (b.notes||[]).length});v.innerHTML='<div class="greeting"><div class="tag">Записная книжка</div><h1>Мои заметки</h1><div class="muted">Мысли, наблюдения и цитаты, связанные с книгами.</div></div>'+(all.length?all.map(function(b){return '<div class="panel rowitem"><strong>'+esc(b.title)+'</strong><small>'+b.notes.length+' страниц заметок</small><div class="actions"><button class="btn light small" onclick="openBook(\''+b.id+'\');detailTab=\'notes\';render()">Открыть заметки</button></div></div>'}).join(''):'<div class="empty">Заметки появятся здесь после добавления на страницы книг.</div>')}
if(tab==='profile'){v.innerHTML='<div class="greeting"><div class="tag">Настройки</div><h1>Профиль</h1><div class="muted">Ваше пространство Inkly.</div></div><div class="panel"><div class="field"><label>Имя</label><input id="pname" value="'+esc(state.profile.name)+'"></div><div class="field"><label>О себе</label><textarea id="pabout">'+esc(state.profile.about)+'</textarea></div><button class="btn" onclick="saveProfile()">Сохранить профиль</button></div><div class="section-head"><h2>Оформление</h2></div><div class="panel"><div class="muted">Цвет интерфейса</div><div class="chips">'+['#6d7954','#7b6658','#647b83','#89718b','#a47755'].map(function(c){return '<button onclick="setTheme(\''+c+'\')" style="width:34px;height:34px;border-radius:50%;border:2px solid white;background:'+c+'"></button>'}).join('')+'</div></div><div class="section-head"><h2>Данные</h2></div><div class="panel"><p class="muted">Сохраните резервную копию библиотеки или восстановите её на другом устройстве.</p><div class="actions"><button class="btn light" onclick="exportBackup()">Экспорт данных</button><button class="btn light" onclick="document.getElementById(\'import-file\').click()">Импорт данных</button><input id="import-file" class="hide" type="file" accept="application/json" onchange="importBackup(event)"></div><p class="muted" style="font-size:12px">Данные пока хранятся в этом браузере. Синхронизация между устройствами и аккаунты требуют серверного подключения.</p></div><div class="section-head"><h2>Категории</h2><button class="btn light small" onclick="manageDisciplines()">Управлять</button></div>'}}
function openBook(id){state.activeBook=id;detailTab='about';notePage=0;render()}function active(){return state.books.find(function(b){return b.id===state.activeBook})}
function detail(v){var b=active();if(!b){state.activeBook=null;render();return}v.innerHTML='<button class="back" onclick="state.activeBook=null;render()">← Назад</button><div class="detail-top">'+bookCover(b,'detail-cover')+'<div><h1>'+esc(b.title)+'</h1><div class="muted">'+esc(b.author)+'</div><div class="chips"><span class="chip">'+esc(b.status||'Прочитано')+'</span>'+(b.discipline?'<span class="chip">'+esc(b.discipline)+'</span>':'')+'</div><div class="muted" style="font-size:12px">'+(b.year?'Год: '+esc(b.year):'')+(b.rating?' · Оценка: '+'★'.repeat(b.rating):'')+'</div><div class="actions"><button class="btn light small" onclick="bookForm(\''+b.id+'\')">Изменить</button><button class="btn ghost small" onclick="deleteBook(\''+b.id+'\')">Удалить</button></div></div></div><div class="tabs">'+[['about','О книге'],['review','Моё мнение'],['notes','Заметки'],['extras','Цитаты и герои']].map(function(a){return '<button class="'+(detailTab===a[0]?'active':'')+'" onclick="detailTab=\''+a[0]+'\';render()">'+a[1]+'</button>'}).join('')+'</div><div id="detail-body"></div>';var body=document.getElementById('detail-body');if(detailTab==='about')body.innerHTML='<div class="panel"><div class="tag">Описание</div><p>'+esc(b.description||'Описание пока не добавлено.')+'</p></div>';if(detailTab==='review')body.innerHTML='<div class="field"><label>Личное мнение и рецензия</label><textarea id="review-text" placeholder="Что вы думаете об этой книге?">'+esc(b.opinion)+'</textarea></div><button class="btn" onclick="saveReview()">Сохранить мнение</button>';if(detailTab==='notes')body.innerHTML='<div class="page-controls"><button onclick="changePage(-1)">← Предыдущая</button><span class="muted">Страница '+(notePage+1)+' из '+Math.max(1,(b.notes||[]).length)+'</span><button onclick="changePage(1)">Следующая →</button></div><div class="note-page"><textarea id="note-text" placeholder="Запишите мысль, наблюдение или идею…">'+esc((b.notes||[])[notePage]||'')+'</textarea><span class="page-num">'+(notePage+1)+'</span></div><div class="actions"><button class="btn" onclick="saveNote()">Сохранить страницу</button><button class="btn light" onclick="addPage()">＋ Новая страница</button></div>';if(detailTab==='extras')body.innerHTML='<div class="field"><label>Цитаты — каждая с новой строки</label><textarea id="quotes-text">'+esc((b.quotes||[]).join('\n'))+'</textarea></div><div class="field"><label>Персонажи и темы</label><textarea id="characters-text">'+esc((b.characters||[]).join('\n'))+'</textarea></div><button class="btn" onclick="saveExtras()">Сохранить</button>'}
function modal(html){document.getElementById('modal-root').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()">'+html+'</div>'}function closeModal(){document.getElementById('modal-root').innerHTML=''}
function bookForm(id){var b=id?state.books.find(function(x){return x.id===id}):{};modal('<div class="dialog-head"><h2>'+(id?'Редактировать книгу':'Новая книга')+'</h2><button class="close" onclick="closeModal()">×</button></div><form id="book-form"><div class="field"><label>Название *</label><input name="title" required value="'+esc(b.title)+'"></div><div class="field"><label>Автор</label><input name="author" value="'+esc(b.author)+'"></div><div class="field"><label>Год издания</label><input name="year" inputmode="numeric" value="'+esc(b.year)+'"></div><div class="field"><label>Категория / дисциплина</label><select name="discipline"><option value="">Без категории</option>'+state.disciplines.map(function(d){return '<option '+(b.discipline===d?'selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select></div><div class="field"><label>Статус</label><select name="status">'+['Прочитано','Читаю','В планах'].map(function(x){return '<option '+((b.status||'Прочитано')===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div class="field"><label>Описание</label><textarea name="description">'+esc(b.description)+'</textarea></div><div class="field"><label>Ссылка на обложку</label><input name="cover" type="url" value="'+esc(b.cover)+'" placeholder="https://…"></div><div class="field"><label>Цвет обложки</label><input name="color" type="color" value="'+(b.color||'#727b59')+'"></div><div class="field"><label>Оценка</label><select name="rating">'+[0,1,2,3,4,5].map(function(n){return '<option value="'+n+'" '+((b.rating||0)==n?'selected':'')+'>'+(n?n+'/5':'Не оценена')+'</option>'}).join('')+'</select></div><button class="btn" type="submit">Сохранить книгу</button></form>');document.getElementById('book-form').onsubmit=function(e){e.preventDefault();var data=Object.fromEntries(new FormData(e.target).entries());data.rating=Number(data.rating);if(id)Object.assign(b,data);else state.books.push(Object.assign(data,{id:'b'+Date.now(),notes:[],quotes:[],characters:[]}));save();closeModal();state.activeBook=id||null;render();toast('Книга сохранена')}}
function saveProfile(){state.profile.name=document.getElementById('pname').value;state.profile.about=document.getElementById('pabout').value;save();toast('Профиль сохранён')}function setTheme(c){document.documentElement.style.setProperty('--olive',c);state.theme=c;save()}function saveReview(){active().opinion=document.getElementById('review-text').value;save();toast('Мнение сохранено')}
function saveNote(){var b=active();b.notes=b.notes||[];b.notes[notePage]=document.getElementById('note-text').value;save();toast('Страница сохранена')}function changePage(n){var b=active();saveNote();notePage=Math.max(0,Math.min((b.notes||[]).length-1,notePage+n));render()}function addPage(){var b=active();saveNote();b.notes.push('');notePage=b.notes.length-1;save();render()}function saveExtras(){var b=active();b.quotes=document.getElementById('quotes-text').value.split('\n').filter(Boolean);b.characters=document.getElementById('characters-text').value.split('\n').filter(Boolean);save();toast('Сохранено')}
function deleteBook(id){if(!confirm('Удалить книгу и связанные заметки?'))return;state.books=state.books.filter(function(b){return b.id!==id});state.activeBook=null;save();render()}
function manageDisciplines(){modal('<div class="dialog-head"><h2>Мои категории</h2><button class="close" onclick="closeModal()">×</button></div><div>'+state.disciplines.map(function(d,i){return '<div class="rowitem">'+esc(d)+' <button class="btn ghost small" style="float:right" onclick="removeDiscipline('+i+')">Удалить</button></div>'}).join('')+'</div><div class="field"><label>Новая категория</label><input id="new-discipline" placeholder="Например, социология"></div><button class="btn" onclick="addDiscipline()">Добавить категорию</button>')}function addDiscipline(){var x=document.getElementById('new-discipline').value.trim();if(x&&!state.disciplines.includes(x)){state.disciplines.push(x);save();manageDisciplines()}}function removeDiscipline(i){state.disciplines.splice(i,1);save();manageDisciplines()}
function exportBackup(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inkly-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')}function importBackup(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.books)||!Array.isArray(d.disciplines))throw Error();state=d;save();render();toast('Данные восстановлены')}catch(x){alert('Не удалось прочитать резервную копию Inkly.')}};r.readAsText(f)}
if(state.theme)setTheme(state.theme);render();
</script></body></html>
